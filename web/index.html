<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThreadBridge</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.mjs"></script></head>
<body><main>
  <header><div class="brand-line"><h1 data-label="heading"></h1><span class="muted">ThreadBridge</span></div><div class="header-actions"><a class="button" href="/settings" data-label="settings"></a><button id="theme" type="button" data-label="theme"></button></div></header>
  <section class="overview" aria-labelledby="state-heading">
    <div class="status-line"><h2 id="state-heading" class="visually-hidden" data-label="status"></h2><span id="state" class="state" role="status"></span><span id="mode" class="muted"></span><span id="pace" class="muted"></span><button class="help" type="button" data-help="sync-help" data-aria="syncHelp" aria-describedby="sync-help" aria-expanded="false">ⓘ</button><button id="pause" type="button" data-label="pause" disabled></button></div>
    <div class="control-line"><div class="sync-actions" role="group" aria-label="同步模式"><button id="sync-ids" type="button" data-label="syncIds" disabled></button><button id="sync-full" type="button" data-label="syncFull" disabled></button></div><label class="watch-option"><input id="watch-new" type="checkbox" role="switch" disabled><span data-label="watchNew"></span></label><div id="browser-controls" class="archive-controls"><label class="watch-option"><input id="browser-archive" type="checkbox" role="switch" disabled><span data-label="browserArchive"></span></label><button class="help" type="button" data-help="archive-help" data-aria="archiveHelp" aria-describedby="archive-help" aria-expanded="false">ⓘ</button></div></div>
    <p id="browser-archive-status" class="muted" role="status" hidden></p><p id="error" class="error" role="alert" hidden></p><p id="control-error" class="error" role="alert" hidden></p>
    <dl class="times"><div><dt data-label="lastRequest"></dt><dd id="last-request"></dd></div><div><dt data-label="lastSaved"></dt><dd id="last-saved"></dd></div><div><dt data-label="nextRequest"></dt><dd><span id="next-request"></span><span id="countdown" class="muted"></span></dd></div></dl>
    <div class="summary-line"><p id="scan" class="muted"></p><button class="help" type="button" data-help="counts-help" data-aria="countsHelp" aria-describedby="counts-help" aria-expanded="false">ⓘ</button></div>
    <dl class="counts"><div><dt data-label="discovered"></dt><dd id="discovered">—</dd></div><div><dt data-label="fullTrees"></dt><dd id="full-trees">—</dd></div><div><dt data-label="textArchives"></dt><dd id="text-archives">—</dd></div><div><dt data-label="browserArchives"></dt><dd id="browser-archives">—</dd></div><div><dt data-label="importedArchives"></dt><dd id="imported-archives">—</dd></div><div><dt data-label="pending"></dt><dd id="pending">—</dd></div></dl>
  </section>
  <aside id="sync-help" class="bubble" popover role="tooltip"><p id="connection-note"></p><p data-label="pauseNote"></p><p data-label="providerCoverage"></p></aside>
  <aside id="archive-help" class="bubble" popover role="tooltip"><p data-label="browserArchiveNote"></p><p id="browser-archive-detail"></p></aside>
  <aside id="counts-help" class="bubble" popover role="tooltip"><p data-label="countsNote"></p></aside>
  <section aria-labelledby="threads-heading">
    <div class="table-heading"><h2 id="threads-heading" data-label="threads"></h2><div class="sync-actions"><button id="import-json" type="button" data-label="importJson"></button><button class="help" type="button" data-help="import-help" data-aria="importJson" aria-describedby="import-help" aria-expanded="false">ⓘ</button><button id="refresh" type="button" data-label="refresh"></button></div></div>
    <input id="import-files" type="file" accept=".json,application/json" multiple hidden><p id="import-status" role="status" aria-live="polite"></p><ul id="import-errors" class="error" role="alert" hidden></ul>
    <aside id="import-help" class="bubble" popover role="tooltip"><p data-label="importNote"></p></aside>
    <form id="search-form"><label for="search" class="visually-hidden" data-label="search"></label><div class="search"><input id="search" type="search" maxlength="200"><button type="submit" data-label="searchButton"></button></div></form>
    <div class="list-summary"><p id="result-count" class="muted" aria-live="polite"></p><div class="mobile-sort"><label for="sort-field" data-label="sort"></label><select id="sort-field"><option value="title" data-label="thread"></option><option value="provider" data-label="provider"></option><option value="scope" data-label="scope"></option><option value="project" data-label="project"></option><option value="coverage" data-label="archiveState"></option><option value="messages" data-label="messages"></option><option value="source_updated" data-label="updated"></option><option value="last_checked_at" data-label="saved"></option></select><select id="sort-direction" data-aria="sort"><option value="asc" data-label="ascending"></option><option value="desc" data-label="descending"></option></select></div></div><p id="empty" class="muted" hidden></p>
    <table><caption class="visually-hidden" data-label="threads"></caption><thead><tr>
      <th scope="col"><button class="sort-header" data-sort="title" type="button"><span data-label="thread"></span><span class="sort-arrow"></span></button></th>
      <th scope="col"><button class="sort-header" data-sort="provider" type="button"><span data-label="provider"></span><span class="sort-arrow"></span></button></th>
      <th scope="col"><button class="sort-header" data-sort="scope" type="button"><span data-label="scope"></span><span class="sort-arrow"></span></button></th>
      <th scope="col"><button class="sort-header" data-sort="project" type="button"><span data-label="project"></span><span class="sort-arrow"></span></button></th>
      <th scope="col"><button class="sort-header" data-sort="coverage" type="button"><span data-label="archiveState"></span><span class="sort-arrow"></span></button></th>
      <th scope="col"><button class="sort-header" data-sort="messages" type="button"><span data-label="messages"></span><span class="sort-arrow"></span></button></th>
      <th scope="col"><button class="sort-header" data-sort="source_updated" type="button"><span data-label="updated"></span><span class="sort-arrow"></span></button></th>
      <th scope="col"><button class="sort-header" data-sort="last_checked_at" type="button"><span data-label="saved"></span><span class="sort-arrow"></span></button></th>
    </tr></thead><tbody id="rows"></tbody></table>
    <div id="sort-menu" class="bubble sort-menu" popover><p id="sort-heading" class="muted"></p><button type="button" data-order="asc" data-label="ascending"></button><button type="button" data-order="desc" data-label="descending"></button><p data-label="sortHelp" class="muted"></p></div>
    <nav class="pagination" aria-label="分页"><button id="previous" type="button" data-label="previous"></button><span id="page"></span><button id="next" type="button" data-label="next"></button></nav>
  </section>
  <footer><p data-label="localOnly"></p><details id="setup"><summary data-label="setup"></summary><ol><li data-label="setupOne"></li><li data-label="setupTwo"></li><li data-label="setupThree"></li></ol></details></footer>
</main></body></html>
